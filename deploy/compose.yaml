# Sentinel, self-hosted. From the repo root:
#
#   cp .env.example .env            # then fill in the values marked REQUIRED
#   docker compose -f deploy/compose.yaml --env-file .env up -d --build                    # core
#   docker compose -f deploy/compose.yaml --env-file .env --profile hosted up -d --build   # + Keycloak
#
# Core: postgres, neuro-san (agents), gateway (API + dashboard on :8000), sandboxd + the per-run
# sandbox image. Hosted adds Keycloak (:8180) for AUTH_MODE=oidc. Untrusted repository code only
# ever runs in the per-run containers sandboxd creates — never in these services.
name: sentinel

x-app: &app
  image: sentinel-app:${SENTINEL_VERSION:-dev}
  build:
    context: ..
    dockerfile: deploy/app.Dockerfile
    args:
      SENTINEL_VERSION: ${SENTINEL_VERSION:-dev}
  restart: unless-stopped
  volumes:
    - workspaces:/workspaces
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://sentinel:${SENTINEL_DB_PASSWORD:?SENTINEL_DB_PASSWORD is required}@postgres:5432/sentinel
    NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    LLM_KEY_SOURCE: ${LLM_KEY_SOURCE:-}
    MODEL_NAME: ${MODEL_NAME:-nvidia-nemotron-3-ultra}
    SANDBOX_MODE: docker
    SANDBOXD_URL: http://sandboxd:8090
    SANDBOXD_TOKEN: ${SANDBOXD_TOKEN:?SANDBOXD_TOKEN is required}
    WORKSPACE_ROOT: /workspaces
    SENTINEL_LICENSE_LOOKUP: ${SENTINEL_LICENSE_LOOKUP:-on}

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SENTINEL_DB_PASSWORD: ${SENTINEL_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me-keycloak-db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-sentinel.sh:/docker-entrypoint-initdb.d/10-sentinel.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel"]
      interval: 5s
      retries: 30

  # Builds the per-run sandbox image, then exits. sandboxd starts containers from it.
  sandbox-image:
    image: ${SANDBOX_IMAGE:-sentinel-sandbox:latest}
    build: ../sandbox
    command: ["true"]
    restart: "no"

  sandboxd:
    build:
      context: ../sandboxd
      dockerfile: ../deploy/sandboxd.Dockerfile
    restart: unless-stopped
    # The Docker socket is root-equivalent: sandboxd is the only service that gets it, it is not
    # published on any host port, and it answers only requests carrying SANDBOXD_TOKEN.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspaces:/workspaces
    environment:
      SANDBOXD_TOKEN: ${SANDBOXD_TOKEN}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-sentinel-sandbox:latest}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runc}
      SANDBOX_WORKSPACE_ROOTS: /workspaces
      SANDBOX_WORKSPACE_MOUNT: /workspaces
      SANDBOX_WORKSPACE_VOLUME: sentinel_workspaces
    depends_on:
      sandbox-image:
        condition: service_completed_successfully

  neuro-san:
    <<: *app
    command: ["python", "scripts/run_server.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/sentinel/function', timeout=5)"]
      interval: 10s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      sandboxd:
        condition: service_started

  gateway:
    <<: *app
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      <<: *app-env
      GATEWAY_PORT: "8000"
      NEURO_SAN_HOST: neuro-san
      NEURO_SAN_PORT: "8080"
      API_TOKENS: ${API_TOKENS:-}
      AUTH_MODE: ${AUTH_MODE:-tokens}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8180}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      SENTINEL_SECRET_KEY: ${SENTINEL_SECRET_KEY:-}
      SENTINEL_ADMIN_EMAILS: ${SENTINEL_ADMIN_EMAILS:-}
      CI_OIDC_AUDIENCE: ${CI_OIDC_AUDIENCE:-sentinel}
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.com}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 10s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      neuro-san:
        condition: service_healthy

  keycloak:
    profiles: [hosted]
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me-keycloak-db}
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # placeholders in realm-sentinel.json
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-unset}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-unset}
      GITHUB_OAUTH_SCOPE: ${GITHUB_OAUTH_SCOPE:-read:user user:email}
      GITLAB_OAUTH_CLIENT_ID: ${GITLAB_OAUTH_CLIENT_ID:-unset}
      GITLAB_OAUTH_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:-unset}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  workspaces:
    name: sentinel_workspaces
