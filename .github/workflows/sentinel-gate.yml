# Sentinel promotion gate for GitHub Actions — blocks merge unless Sentinel decides "promote".
#
# Copy this file into the repo's .github/workflows/. Setup (README "CI integration"):
#   1. Register the repo in Sentinel (Settings → Repositories). Hosted Sentinel checks that your
#      linked GitHub account administers it.
#   2. Repository VARIABLE (not a secret — it is not sensitive):
#        SENTINEL_GATEWAY_URL   e.g. https://sentinel.example.com
#   3. Nothing else. The job proves which repo it is with a GitHub OIDC token (`id-token: write`),
#      so no long-lived secret exists. Fallback for Sentinels that cannot reach GitHub's OIDC keys:
#      repository SECRET SENTINEL_API_KEY = a per-repo key from Settings → Repositories.
#
# The job is skipped entirely in repos without SENTINEL_GATEWAY_URL, and for fork PRs (a fork's
# head SHA is not reachable from the base repo, and forks must not get this job's tokens).
#
# Self-hosted runners: never run this (or any) workflow on a self-hosted runner for a PUBLIC repo
# without "require approval for all outside collaborators" — a PR could run code on your machine.

name: Sentinel gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base_sha: { description: base commit SHA, required: true }
      head_sha: { description: head commit SHA, required: true }

permissions:
  contents: read
  id-token: write        # mint the OIDC job token Sentinel verifies
  pull-requests: write   # one PR comment, updated in place on every push

concurrency:
  group: sentinel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FROM_ENV: dev          # which promotion this gate represents
  TO_ENV: test
  POLL_TIMEOUT_SECONDS: "1500"
  AUDIENCE: ${{ vars.SENTINEL_AUDIENCE || 'sentinel' }}

jobs:
  gate:
    if: ${{ vars.SENTINEL_GATEWAY_URL != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    steps:
      - name: Run Sentinel and gate on its decision
        id: gate
        env:
          GW: ${{ vars.SENTINEL_GATEWAY_URL }}
          API_KEY: ${{ secrets.SENTINEL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.inputs.head_sha }}
          PR_TITLE: ${{ github.event.pull_request.title || github.ref_name }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR_AUTHOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          GW="${GW%/}"

          # Fresh credentials for every call: an OIDC job token lives minutes, a poll can take longer.
          auth() {
            if [ -n "$API_KEY" ]; then
              printf 'X-Sentinel-Key: %s' "$API_KEY"
            else
              tok=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r '.value')
              printf 'Authorization: Bearer %s' "$tok"
            fi
          }

          # Upsert one comment per marker, so the gate comment and the tests comment never overwrite
          # each other however many times the PR is pushed.
          upsert() {  # $1 marker, $2 body file
            [ -n "$PR" ] || return 0
            id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$1\")) | .id" 2>/dev/null | head -1 || true)
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$2" >/dev/null
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$2" >/dev/null
            fi || echo "::warning::could not post the PR comment"
          }

          # Authenticated clone URL so Sentinel can fetch a private repo; the token dies with this job.
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          event=$(jq -nc \
            --arg eid "gha-${GITHUB_REPOSITORY}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg url "$REPO_URL" --arg name "$GITHUB_REPOSITORY" \
            --arg base "$BASE_SHA" --arg head "$HEAD_SHA" \
            --arg branch "$PR_BRANCH" --arg title "$PR_TITLE" --arg author "$PR_AUTHOR" \
            --arg from "$FROM_ENV" --arg to "$TO_ENV" \
            '{event_id:$eid, source:"github",
              repo:{url:$url, name:$name, default_branch:"main"},
              change:{base_sha:$base, head_sha:$head, branch:$branch, title:$title, author:$author},
              target_transition:{from_env:$from, to_env:$to}, requested_by:$author}')

          resp=$(curl -sS -X POST "$GW/api/v1/ci/runs" -H "$(auth)" \
                 -H "Content-Type: application/json" -d "{\"event\": $event}")
          run_id=$(echo "$resp" | jq -r '.run_id // empty')
          [ -n "$run_id" ] || { echo "::error::Sentinel refused the run: $resp"; exit 1; }
          echo "Sentinel run: $GW/runs/$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          deadline=$(( $(date +%s) + POLL_TIMEOUT_SECONDS ))
          state=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            detail=$(curl -sf "$GW/api/v1/ci/runs/$run_id" -H "$(auth)" || echo '{}')
            state=$(echo "$detail" | jq -r '.state // "unknown"')
            echo "  state=$state"
            if [ "$state" = "done" ] || [ "$state" = "failed" ]; then break; fi
            sleep 15
          done

          decision=$(echo "$detail" | jq -r '.decision.decision // "none"')
          health=$(echo "$detail" | jq -r '.review.pr_health_score // "n/a"')
          crit=$(echo "$detail" | jq -r '.review.counts.critical // 0')
          high=$(echo "$detail" | jq -r '.review.counts.high // 0')
          rule=$(echo "$detail" | jq -r '.decision.rule_fired // ""')
          summary=$(echo "$detail" | jq -r '.review.executive_summary // ""' | head -c 1500)

          {
            echo "<!-- sentinel-gate -->"
            echo "### Sentinel gate: \`$decision\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| decision | \`$decision\` ${rule:+(\`$rule\`)} |"
            echo "| review health | $health |"
            echo "| critical / high findings | $crit / $high |"
            echo "| full report | $GW/runs/$run_id |"
            echo ""
            echo "$summary"
          } > sentinel-comment.md
          cat sentinel-comment.md >> "$GITHUB_STEP_SUMMARY"

          upsert "<!-- sentinel-gate -->" sentinel-comment.md

          if [ "$state" != "done" ]; then
            echo "::error::Sentinel run did not finish (state=$state): $GW/runs/$run_id"; exit 1
          fi
          if [ "$decision" != "promote" ]; then
            echo "::error::Sentinel decided '$decision' ($crit critical, $high high). Review: $GW/runs/$run_id"; exit 1
          fi
          echo "Sentinel: promote"

      # Advisory, never blocks the merge: for changed functions that no test reaches, Sentinel writes
      # a test after the gate decided, proves it against injected bugs, and this step posts it.
      - name: Generated tests (advisory)
        if: ${{ always() && steps.gate.outputs.run_id != '' }}
        continue-on-error: true
        env:
          GW: ${{ vars.SENTINEL_GATEWAY_URL }}
          API_KEY: ${{ secrets.SENTINEL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ steps.gate.outputs.run_id }}
        run: |
          set -euo pipefail
          GW="${GW%/}"
          auth() {
            if [ -n "$API_KEY" ]; then printf 'X-Sentinel-Key: %s' "$API_KEY"; else
              tok=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r '.value')
              printf 'Authorization: Bearer %s' "$tok"; fi
          }
          # Upsert one comment per marker, so the gate comment and the tests comment never overwrite
          # each other however many times the PR is pushed.
          upsert() {  # $1 marker, $2 body file
            [ -n "$PR" ] || return 0
            id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$1\")) | .id" 2>/dev/null | head -1 || true)
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$2" >/dev/null
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$2" >/dev/null
            fi || echo "::warning::could not post the PR comment"
          }
          deadline=$(( $(date +%s) + 1200 )); gen=pending
          while [ "$(date +%s)" -lt "$deadline" ]; do
            detail=$(curl -sf "$GW/api/v1/ci/runs/$RUN_ID" -H "$(auth)" || echo '{}')
            gen=$(echo "$detail" | jq -r '.test_generation // "pending"')
            if [ "$gen" = "done" ] || [ "$gen" = "none" ]; then break; fi
            sleep 20
          done
          echo "test generation: $gen"
          n=$(echo "$detail" | jq '[.test_proposals[]? | select(.verdict == "accepted")] | length')
          [ "$gen" = "done" ] && [ "$n" -gt 0 ] || { echo "no accepted test proposals"; exit 0; }
          {
            echo "<!-- sentinel-tests -->"
            echo "### Sentinel: $n proposed test(s) for changed code no test reached"
            echo ""
            echo "Each one passed on this PR's code and caught injected bugs. Nothing is committed —"
            echo "copy what you want to keep. Details: $GW/runs/$RUN_ID"
            echo "$detail" | jq -r '.test_proposals[] | select(.verdict == "accepted")
              | "\n#### `\(.target_file)::\(.target_function)` → `\(.test_path)`\nmutation score \(.mutation_score) · \(.classification // "unclassified")\n\n```\n\(.test_source)\n```"'
          } > sentinel-tests.md
          upsert "<!-- sentinel-tests -->" sentinel-tests.md
